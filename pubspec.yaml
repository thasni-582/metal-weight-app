name: metal_weight
description: A metal weight calculator app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.2
  share_plus: ^10.0.0
  path_provider: ^2.0.0
  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/image.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/